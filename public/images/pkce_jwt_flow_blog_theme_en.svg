<svg width="100%" viewBox="0 0 780 600" role="img" style="background:#1a0a2e;border-radius:12px;" xmlns="http://www.w3.org/2000/svg">
  <title>authentication flow: SPA, Identity Provider, and Backend</title>
  <desc>Diagram showing the PKCE flow between the SPA and the Identity Provider, followed by JWT validation via JWKS between the SPA and the Backend.</desc>

  <defs>
    <marker id="arr2en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="glow-pink2en">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green2en">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ===== COLUMN HEADERS ===== -->
  <text x="100" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ff69b4">SPA (browser)</text>
  <text x="390" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="rgba(200,150,255,0.9)">Identity Provider</text>
  <text x="680" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#00ff88">Backend (Go)</text>

  <!-- ===== RAIL LINES ===== -->
  <line x1="100" y1="36" x2="100" y2="560" stroke="rgba(255,20,147,0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="390" y1="36" x2="390" y2="300" stroke="rgba(123,47,255,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="680" y1="36" x2="680" y2="440" stroke="rgba(0,255,136,0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===== PKCE SECTION LABEL ===== -->
  <rect x="20" y="48" width="740" height="252" rx="14" fill="rgba(255,20,147,0.04)" stroke="rgba(255,20,147,0.22)" stroke-width="1"/>
  <text x="40" y="70" font-family="monospace" font-size="11" font-weight="700" fill="rgba(255,100,180,0.7)">PKCE</text>

  <!-- Step 1: SPA generates verifier + challenge -->
  <rect x="36" y="82" width="200" height="46" rx="8" fill="rgba(255,20,147,0.08)" stroke="#ff1493" stroke-width="1.3" filter="url(#glow-pink2en)"/>
  <text x="46" y="100" font-family="monospace" font-size="11" fill="#ff69b4">1. generates code_verifier</text>
  <text x="46" y="116" font-family="monospace" font-size="11" fill="#ff69b4">   + code_challenge</text>

  <!-- Arrow SPA -> IdP: redirect (challenge) -->
  <path d="M238 112 L378 112" fill="none" stroke="rgba(255,20,147,0.5)" stroke-width="1.5" marker-end="url(#arr2en)"/>
  <text x="308" y="104" text-anchor="middle" font-family="monospace" font-size="9.5" fill="rgba(255,180,220,0.55)">redirect (challenge)</text>

  <!-- IdP: user logs in -->
  <rect x="330" y="126" width="120" height="26" rx="6" fill="rgba(123,47,255,0.08)" stroke="rgba(123,47,255,0.4)" stroke-width="1"/>
  <text x="390" y="143" text-anchor="middle" font-family="monospace" font-size="10.5" fill="rgba(200,150,255,0.85)">user logs in</text>

  <!-- Arrow IdP -> SPA: redirect with code -->
  <path d="M378 172 L238 172" fill="none" stroke="rgba(123,47,255,0.5)" stroke-width="1.5" marker-end="url(#arr2en)"/>
  <text x="308" y="164" text-anchor="middle" font-family="monospace" font-size="9.5" fill="rgba(200,150,255,0.6)">redirect with "code"</text>

  <!-- Step 2: exchanges code + verifier -->
  <rect x="36" y="192" width="200" height="26" rx="8" fill="rgba(255,20,147,0.08)" stroke="#ff1493" stroke-width="1.3" filter="url(#glow-pink2en)"/>
  <text x="46" y="209" font-family="monospace" font-size="11" fill="#ff69b4">2. exchanges code + verifier</text>

  <!-- Arrow SPA -> IdP: code + verifier -->
  <path d="M238 234 L378 234" fill="none" stroke="rgba(255,20,147,0.5)" stroke-width="1.5" marker-end="url(#arr2en)"/>
  <text x="308" y="226" text-anchor="middle" font-family="monospace" font-size="9.5" fill="rgba(255,180,220,0.55)">code + verifier</text>

  <!-- Arrow IdP -> SPA: id_token (JWT) -->
  <path d="M378 264 L238 264" fill="none" stroke="rgba(0,255,136,0.55)" stroke-width="1.7" marker-end="url(#arr2en)" filter="url(#glow-green2en)"/>
  <text x="308" y="256" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#00ff88">id_token (JWT)</text>

  <!-- ===== JWT/JWKS SECTION LABEL ===== -->
  <rect x="20" y="312" width="740" height="230" rx="14" fill="rgba(0,255,136,0.03)" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
  <text x="40" y="334" font-family="monospace" font-size="11" font-weight="700" fill="rgba(0,255,136,0.75)">JWT + JWKS</text>

  <!-- Step 3: sends id_token -->
  <rect x="36" y="346" width="200" height="26" rx="8" fill="rgba(0,255,136,0.06)" stroke="rgba(0,255,136,0.4)" stroke-width="1.2"/>
  <text x="46" y="363" font-family="monospace" font-size="11" fill="#00ff88">3. sends id_token</text>

  <!-- Arrow SPA -> Backend: id_token -->
  <path d="M238 392 L668 392" fill="none" stroke="rgba(0,255,136,0.55)" stroke-width="1.8" marker-end="url(#arr2en)" filter="url(#glow-green2en)"/>
  <text x="450" y="384" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#00ff88">id_token</text>

  <!-- Backend: validates signature -->
  <rect x="530" y="404" width="220" height="46" rx="8" fill="rgba(0,255,136,0.07)" stroke="#00ff88" stroke-width="1.4" filter="url(#glow-green2en)"/>
  <text x="640" y="422" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#00ff88">validates signature</text>
  <text x="640" y="438" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#00ff88">via JWKS + iss/aud/exp</text>

  <!-- Arrow Backend -> SPA: session created -->
  <path d="M668 470 L238 470" fill="none" stroke="rgba(0,255,136,0.55)" stroke-width="1.8" marker-end="url(#arr2en)" filter="url(#glow-green2en)"/>
  <text x="450" y="462" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#00ff88">session created</text>

  <!-- ===== LEGEND ===== -->
  <rect x="40" y="556" width="700" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,100,180,0.15)" stroke-width="1"/>
  <rect x="56" y="565" width="14" height="14" rx="3" fill="rgba(255,20,147,0.1)" stroke="#ff1493" stroke-width="1.2"/>
  <text x="78" y="576" font-family="monospace" font-size="10" fill="rgba(255,180,220,0.7)">PKCE — the SPA proves who it is, without a fixed secret</text>
  <rect x="420" y="565" width="14" height="14" rx="3" fill="rgba(0,255,136,0.08)" stroke="#00ff88" stroke-width="1.2"/>
  <text x="442" y="576" font-family="monospace" font-size="10" fill="rgba(255,180,220,0.7)">JWT + JWKS — backend trusts without calling the provider</text>
</svg>
