<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 466" width="100%" role="img">
  <title>Teammate feedback about the run-local</title>
  <defs>
    <filter id="glow-pink">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="520" height="466" rx="12" fill="rgba(255,255,255,0.04)"/>

  <!-- Top bar -->
  <rect x="1" y="1" width="518" height="36" rx="12" fill="rgba(255,20,147,0.07)"/>
  <rect x="1" y="25" width="518" height="12" fill="rgba(255,20,147,0.07)"/>
  <circle cx="18" cy="18" r="5" fill="rgba(255,100,180,0.25)"/>
  <circle cx="34" cy="18" r="5" fill="rgba(255,100,180,0.15)"/>
  <circle cx="50" cy="18" r="5" fill="rgba(255,100,180,0.1)"/>
  <text x="260" y="22" text-anchor="middle" font-family="monospace" font-size="10"
        fill="rgba(255,180,220,0.4)" letter-spacing="0.06em"># general</text>

  <!-- MESSAGE 1: teammate -->
  <circle cx="52" cy="72" r="16" fill="#3d1060" stroke="rgba(255,20,147,0.3)" stroke-width="1"/>
  <text x="52" y="76" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700"
        fill="rgba(200,150,255,0.9)">T</text>
  <text x="76" y="60" font-family="monospace" font-size="12" font-weight="700"
        fill="rgba(200,150,255,0.85)">teammate</text>
  <text x="143" y="60" font-family="monospace" font-size="9"
        fill="rgba(255,180,220,0.3)">3:06pm</text>
  <text x="76" y="76" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">I need to give you some feedback</text>
  <text x="76" y="93" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">the run-local is incredibly good</text>
  <text x="76" y="110" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">congrats</text>

  <!-- divider -->
  <line x1="36" y1="130" x2="484" y2="130" stroke="rgba(255,100,180,0.08)" stroke-width="1"/>

  <!-- MESSAGE 2: me -->
  <circle cx="52" cy="158" r="16" fill="#2d0a4e" stroke="rgba(255,20,147,0.4)" stroke-width="1"
          filter="url(#glow-pink)"/>
  <text x="52" y="162" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700"
        fill="#ff69b4">me</text>
  <text x="76" y="146" font-family="monospace" font-size="12" font-weight="700"
        fill="#ff69b4">me</text>
  <text x="100" y="146" font-family="monospace" font-size="9"
        fill="rgba(255,180,220,0.3)">3:08pm</text>
  <text x="76" y="162" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">glad you liked it</text>
  <text x="76" y="179" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">way better than having 1000000 repos</text>
  <text x="76" y="196" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">cloned inside right</text>
  <text x="76" y="213" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">lmaooooooooooooooo</text>
  <text x="76" y="230" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">so good</text>
  <text x="76" y="247" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">happy it helped</text>

  <!-- divider -->
  <line x1="36" y1="265" x2="484" y2="265" stroke="rgba(255,100,180,0.08)" stroke-width="1"/>

  <!-- MESSAGE 3: teammate -->
  <circle cx="52" cy="293" r="16" fill="#3d1060" stroke="rgba(255,20,147,0.3)" stroke-width="1"/>
  <text x="52" y="297" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700"
        fill="rgba(200,150,255,0.9)">T</text>
  <text x="76" y="281" font-family="monospace" font-size="12" font-weight="700"
        fill="rgba(200,150,255,0.85)">teammate</text>
  <text x="143" y="281" font-family="monospace" font-size="9"
        fill="rgba(255,180,220,0.3)">3:10pm</text>
  <text x="76" y="297" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">yeah</text>
  <text x="76" y="314" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">damn</text>
  <text x="76" y="331" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">hot reload works perfectly too</text>
  <text x="76" y="348" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">really really good</text>
  <!-- divider -->
  <line x1="36" y1="366" x2="484" y2="366" stroke="rgba(255,100,180,0.08)" stroke-width="1"/>

  <!-- MESSAGE 4: me -->
  <circle cx="52" cy="392" r="16" fill="#2d0a4e" stroke="rgba(255,20,147,0.4)" stroke-width="1"
          filter="url(#glow-pink)"/>
  <text x="52" y="396" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700"
        fill="#ff69b4">me</text>
  <text x="76" y="380" font-family="monospace" font-size="12" font-weight="700"
        fill="#ff69b4">me</text>
  <text x="100" y="380" font-family="monospace" font-size="9"
        fill="rgba(255,180,220,0.3)">3:31pm</text>
  <text x="76" y="396" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">hehe ty</text>
  <text x="76" y="413" font-family="monospace" font-size="12"
        fill="rgba(255,220,240,0.75)">*gif of a dancing cat*</text>

  <!-- thin divider -->
  <line x1="36" y1="433" x2="484" y2="433" stroke="rgba(255,100,180,0.06)" stroke-width="1"/>

  <!-- caption -->
  <text x="260" y="451" text-anchor="middle" font-family="monospace" font-size="10"
        fill="rgba(255,180,220,0.25)">real feedback, nothing fake, just can't expose names. made me very very happy</text>
</svg>
